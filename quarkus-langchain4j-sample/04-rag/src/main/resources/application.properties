# Set your OpenAI API key here, or export QUARKUS_LANGCHAIN4J_OPENAI_API_KEY instead.
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:sk-...}

# Dimension of the OpenAI embedding model (text-embedding-ada-002 / text-embedding-3-small).
quarkus.langchain4j.pgvector.dimension=1536

# In dev/test mode, Quarkus Dev Services automatically starts a PostgreSQL
# container with the pgvector extension enabled - no further configuration needed.
#
# For prod mode, configure a real PostgreSQL database with pgvector enabled:
#quarkus.datasource.db-kind=postgresql
#quarkus.datasource.username=quarkus
#quarkus.datasource.password=quarkus
#quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/rag
